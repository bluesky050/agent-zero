user_message: |
  请为以下函数编写单元测试：

  ```python
  def is_palindrome(s: str) -> bool:
      """检查字符串是否为回文"""
      s = s.lower().replace(" ", "")
      return s == s[::-1]
  ```

success_criteria: 测试覆盖正常情况、边界情况和异常情况

