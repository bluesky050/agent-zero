user_message: |
  请完成以下多步骤任务：
  1. 生成 100 个 1-1000 的随机整数
  2. 找出其中的质数
  3. 将质数写入文件
  4. 从文件读取并计算统计信息（平均、最大、最小）
  5. 打印结果报告

success_criteria: 完成所有步骤，结果正确

